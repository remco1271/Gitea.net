name: Build

on: 
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  actions: write
  contents: read

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.version.outputs.is_new }}
    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Print dotnet version
        run: dotnet --info
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The version is set by hand in src/Gitea.Net/Gitea.Net.csproj (<Version>).
      # A release is only made when that version has no git tag yet.
      - name: Read version
        id: version
        run: |
          version=$(dotnet msbuild src/Gitea.Net/Gitea.Net.csproj -getProperty:Version)
          if [ -z "$version" ]; then
            echo "::error::No <Version> found in src/Gitea.Net/Gitea.Net.csproj"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            is_new=false
            echo "::notice::Version $version is already released. Bump <Version> in Gitea.Net.csproj to publish a new release."
          else
            is_new=true
          fi
          echo "Version: $version (new: $is_new)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_new=$is_new" >> "$GITHUB_OUTPUT"
      - name: Build .NET
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Create Package
        run: dotnet pack -c Release --no-build
      - name: Write Version File
        run: echo "${{ steps.version.outputs.version }}" > version.txt
      - name: Upload version file as artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-version
          path: version.txt
      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: src/Gitea.Net/bin/Release/*nupkg

  release:
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.package.outputs.is_new == 'true'
    steps:
      - name: Invoke Release Workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: release.yml
          inputs: '{ "workflow_run_id": "${{ github.run_id }}" }'
